name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: node evals/run.mjs
      - run: for f in spec/examples/*.json; do node compose/cli.mjs compose "$f" --out "build/$(basename "$f" .json)"; done
      - uses: actions/upload-artifact@v4
        with: { name: bundles, path: build/*.zip }
